<style>
  .new-badge {
    display: inline-block;
    margin-left: 0.45em;
    padding: 0.12em 0.45em;
    background: #ff3b30;
    color: #fff !important;
    font-size: 0.55em;
    font-weight: 800;
    line-height: 1.15;
    border-radius: 0.3em;
    vertical-align: middle;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #access-lastmod .new-badge {
    font-size: 0.7em;
    padding: 0.1em 0.36em;
    margin-left: 0.35em;
  }
</style>

<script>
(function () {
  var NEW_DAYS = 7;
  var cutoffSec = NEW_DAYS * 86400;
  var futureToleranceSec = 86400;

  /* 빌드 시점에 Liquid가 박아준 URL → Unix timestamp 맵 */
  var POST_TIMES = {
    {%- for post in site.posts limit:100 -%}
    "{{ post.url }}": {{ post.date | date: '%s' }}{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  };

  function makeBadge() {
    var b = document.createElement('span');
    b.className = 'new-badge';
    b.textContent = 'N';
    return b;
  }

  function isNew(ts) {
    var age = Date.now() / 1000 - ts;
    return age <= cutoffSec && age >= -futureToleranceSec;
  }

  function run() {
    /* 1) 카드형 글 목록 (홈/카테고리/태그/아카이브) — URL로 매칭 */
    var cardLinks = document.querySelectorAll('article.card-wrapper a[href]');
    cardLinks.forEach(function (a) {
      var href = a.getAttribute('href');
      var ts = POST_TIMES[href];
      if (typeof ts !== 'number' || !isNew(ts)) return;
      var card = a.closest('article.card-wrapper');
      if (!card) return;
      var title = card.querySelector('.card-title');
      if (title && !title.querySelector('.new-badge')) {
        title.appendChild(makeBadge());
      }
    });

    /* 2) 사이드바 "최근 업데이트" — 동일하게 URL로 매칭 */
    document.querySelectorAll('#access-lastmod ul li a').forEach(function (a) {
      var href = a.getAttribute('href');
      var ts = POST_TIMES[href];
      if (typeof ts !== 'number' || !isNew(ts)) return;
      if (!a.querySelector('.new-badge')) {
        a.appendChild(makeBadge());
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
