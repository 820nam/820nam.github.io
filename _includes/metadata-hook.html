<style>
  /* ── NEW 배지 ── */
  .new-badge {
    display: inline-block;
    margin-left: 0.45em;
    padding: 0.12em 0.45em;
    background: #ff3b30;
    color: #fff !important;
    font-size: 0.55em;
    font-weight: 800;
    line-height: 1.15;
    border-radius: 0.3em;
    vertical-align: middle;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  #access-lastmod .new-badge {
    font-size: 0.7em;
    padding: 0.1em 0.36em;
    margin-left: 0.35em;
  }

  /* ── 조회수 배지 ── */
  .view-counter-img {
    vertical-align: middle;
    height: 1.45em;
  }
  .post-meta .view-counter-wrap,
  .post-meta-bottom .view-counter-wrap {
    display: inline-flex;
    align-items: center;
    margin-left: 0.6rem;
    white-space: nowrap;
  }
  /* 사이드바 사이트 총 방문 — 충분한 여백 + 위/아래 구분선 */
  .site-counter-wrap {
    display: flex;
    justify-content: center;
    padding: 1.4rem 0.4rem;
    margin: 0.6rem 0 0.4rem;
    border-top: 1px solid rgba(255,255,255,0.08);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    width: 100%;
  }
  .site-counter-wrap img {
    height: 1.8em;
  }
  /* 라이트 모드 구분선 색상 */
  html:not([data-mode="dark"]) .site-counter-wrap {
    border-top-color: rgba(0,0,0,0.06);
    border-bottom-color: rgba(0,0,0,0.06);
  }
  /* 카드 안의 조회수 배지는 조금 더 작게 */
  article.card-wrapper .view-counter-img {
    height: 1.35em;
  }
</style>

<script>
(function () {
  /* ───────────────────────────────────────── */
  /* 1) NEW 배지 — URL 매칭 방식 (Chirpy time 처리와 무관) */
  /* ───────────────────────────────────────── */
  var NEW_DAYS = 7;
  var cutoffSec = NEW_DAYS * 86400;
  var futureToleranceSec = 86400;

  var POST_TIMES = {
    {%- for post in site.posts limit:100 -%}
    "{{ post.url }}": {{ post.date | date: '%s' }}{%- unless forloop.last -%},{%- endunless -%}
    {%- endfor -%}
  };

  function makeBadge() {
    var b = document.createElement('span');
    b.className = 'new-badge';
    b.textContent = 'N';
    return b;
  }

  function isNew(ts) {
    var age = Date.now() / 1000 - ts;
    return age <= cutoffSec && age >= -futureToleranceSec;
  }

  function applyNewBadges() {
    document.querySelectorAll('article.card-wrapper a[href]').forEach(function (a) {
      var ts = POST_TIMES[a.getAttribute('href')];
      if (typeof ts !== 'number' || !isNew(ts)) return;
      var card = a.closest('article.card-wrapper');
      if (!card) return;
      var title = card.querySelector('.card-title');
      if (title && !title.querySelector('.new-badge')) {
        title.appendChild(makeBadge());
      }
    });
    document.querySelectorAll('#access-lastmod ul li a').forEach(function (a) {
      var ts = POST_TIMES[a.getAttribute('href')];
      if (typeof ts !== 'number' || !isNew(ts)) return;
      if (!a.querySelector('.new-badge')) {
        a.appendChild(makeBadge());
      }
    });
  }

  /* ───────────────────────────────────────── */
  /* 2) 조회수 배지 — hits.sh */
  /* ───────────────────────────────────────── */
  var SITE_KEY = '820nam.github.io';

  function makeViewCounter(key, label, color) {
    var url = 'https://hits.sh/' + key + '.svg?style=flat-square&label=' + encodeURIComponent(label) + '&color=' + color;
    var img = document.createElement('img');
    img.src = url;
    img.alt = label;
    img.className = 'view-counter-img';
    img.loading = 'eager';
    return img;
  }

  /* GoatCounter 셋업 시 GC_CODE를 채워주면 카드 조회수가 정확히 표시됨
     (https://[GC_CODE].goatcounter.com 의 GC_CODE 부분) */
  var GC_CODE = "{{ site.analytics.goatcounter.id | default: '' }}";

  function applyViewCounters() {
    /* (a) 글 상세 페이지 — 글 상단에 조회수 배지 (hits.sh, 실제 방문만 증가) */
    if (/^\/posts\//.test(location.pathname)) {
      var postKey = SITE_KEY + location.pathname.replace(/\/$/, '');
      var img = makeViewCounter(postKey, '조회', '212529');
      var wrap = document.createElement('span');
      wrap.className = 'view-counter-wrap';
      wrap.appendChild(img);
      var meta = document.querySelector('.post-meta.text-muted') || document.querySelector('header .post-meta') || document.querySelector('.post-meta');
      if (meta && !meta.querySelector('.view-counter-wrap')) {
        meta.appendChild(wrap);
      }
    }

    /* (b) 카드별 조회수 — GoatCounter가 셋업되어 있을 때만 표시
       (hits.sh는 카드에 박으면 클릭 안 해도 카운트 +1되는 inflate 문제 있음 → 사용 안 함) */
    if (GC_CODE) {
      document.querySelectorAll('article.card-wrapper a[href]').forEach(function (a) {
        var href = a.getAttribute('href') || '';
        if (!/^\/posts\//.test(href)) return;
        var card = a.closest('article.card-wrapper');
        if (!card) return;
        var cardMeta = card.querySelector('.post-meta');
        if (!cardMeta || cardMeta.querySelector('.view-counter-text')) return;
        var span = document.createElement('span');
        span.className = 'view-counter-text';
        span.style.cssText = 'margin-left:0.6rem;color:#6c757d;font-size:0.9em;white-space:nowrap;';
        span.textContent = '👁 …';
        cardMeta.appendChild(span);
        /* GoatCounter API: GET counts (no increment) */
        fetch('https://' + GC_CODE + '.goatcounter.com/counter/' + encodeURIComponent(href) + '.json')
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (j) {
            if (j && typeof j.count_unique !== 'undefined') {
              span.textContent = '👁 ' + j.count_unique;
            } else if (j && typeof j.count !== 'undefined') {
              span.textContent = '👁 ' + j.count;
            } else {
              span.textContent = '👁 0';
            }
          })
          .catch(function () { span.textContent = '👁 0'; });
      });
    }

    /* (c) 모든 페이지의 사이드바에 사이트 총 방문 배지 */
    var sidebar = document.getElementById('sidebar');
    if (sidebar && !sidebar.querySelector('.site-counter-wrap')) {
      var siteImg = makeViewCounter(SITE_KEY, '방문', '0066ff');
      var siteWrap = document.createElement('div');
      siteWrap.className = 'site-counter-wrap';
      siteWrap.appendChild(siteImg);
      var bottom = sidebar.querySelector('.sidebar-bottom');
      if (bottom) {
        sidebar.insertBefore(siteWrap, bottom);
      } else {
        sidebar.appendChild(siteWrap);
      }
    }
  }

  function run() {
    applyNewBadges();
    applyViewCounters();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
